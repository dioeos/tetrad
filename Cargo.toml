[workspace]
resolver = "3"
members = [
  # crates
  "src/crates/tetrad-lib",
  "src/crates/tetrad-core",
  "src/crates/tetrad-web",

  # web server
  "src/server/services/web-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

